# nl2opt 全局配置。环境变量会覆盖同名配置（见 config.py 的映射规则）。

llm:
  provider: deepseek          # 目前仅实现 deepseek（OpenAI 兼容）
  base_url: https://api.deepseek.com
  model: deepseek-flash       # 实测可用模型：deepseek-v4-pro / deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  reasoning_effort: low        # 固定 low
                          
  max_tokens: 65536           # 思考型模型会占用 max_tokens，需给足（否则正文 JSON 被截断）
                              # 历史：32768 对最大实例是**临界值**（一次成功、一次截断，属随机悬崖）
  timeout_seconds: 600         # 单次调用超时：思考型模型 + 大输出可能耗时数分钟，
                               # 给太小会把「题大」误判为「失败」（300s 实测不足）

  pricing:
    currency: CNY
    default_model: deepseek-flash
    models:
      deepseek-flash:              # 本项目默认模型
        idle:                      # 空闲时段（约高峰的半价）
          input_cache_hit: 0.02
          input_cache_miss: 1.0
          output: 4.0
        peak:
          input_cache_hit: 0.04
          input_cache_miss: 2.0
          output: 8.0
      deepseek-v4-pro:             # 换模型对比用（输出单价约为 flash 的 3.4 倍）
        idle:
          input_cache_hit: 0.15
          input_cache_miss: 4.5
          output: 13.5
        peak:
          input_cache_hit: 0.30
          input_cache_miss: 9.0
          output: 27.0

pipeline:
  attempts: 2                  # 每题最多几次「解答机会」。每次都是独立的「理解→修复」，
                               # 任何一次成功即停止。2 = 给两次机会。
  max_rounds: 3                # 单次机会内最多求解几轮 → **3 轮 = 2 次修复**
                               # （第 3 轮失败后不再重写，除非还有下一轮可用）
  objective_tolerance: 1e-4    # 目标值对比容差
  feasibility_tolerance: 1e-6  # 可行性/整数性检查容差
  repeated_error_limit: 3      # 连续相同错误达到 N 轮即终止（避免空转烧 token）

executor:
  timeout_seconds: 120         # 单题求解墙钟预算（秒）

paths:
  data_dir: data
  logs_dir: logs
  artifacts_dir: artifacts
