[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2opt"
version = "0.1.0"
description = "自然语言 → 优化模型：LLM 只产符号 IR，展开后由求解器与独立验证器复核，失败按验证原因重写（理解-展开-求解-验证-重写闭环）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nl2opt" }]
keywords = ["nlp", "optimization", "linear-programming", "milp", "llm-agent"]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.25",
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nl2opt = "nl2opt.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
